<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="t">
  <title id="t">AI Buddy logo</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#1b2430"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc247"/>
      <stop offset="1" stop-color="#ff9f1a"/>
    </linearGradient>
  </defs>
  <!-- the desk-buddy body -->
  <circle cx="160" cy="165" r="118" fill="url(#bg)" stroke="url(#amber)" stroke-width="8"/>
  <!-- the screen: a round face -->
  <circle cx="160" cy="170" r="84" fill="#05080c"/>
  <!-- eyes with a little glint -->
  <circle cx="124" cy="158" r="14" fill="#ffd27a"/>
  <circle cx="196" cy="158" r="14" fill="#ffd27a"/>
  <circle cx="128" cy="153" r="4" fill="#05080c"/>
  <circle cx="200" cy="153" r="4" fill="#05080c"/>
  <!-- smile -->
  <path d="M120 200 Q160 232 200 200" fill="none" stroke="#ffb020" stroke-width="7" stroke-linecap="round"/>
  <!-- the hat: a tip of personality -->
  <g transform="translate(160 62)">
    <rect x="-64" y="8" width="128" height="14" rx="7" fill="url(#amber)"/>
    <path d="M-40 10 L-30 -42 L30 -42 L40 10 Z" fill="url(#amber)"/>
    <rect x="-30" y="-14" width="60" height="8" rx="4" fill="#05080c" opacity="0.55"/>
  </g>
</svg>
